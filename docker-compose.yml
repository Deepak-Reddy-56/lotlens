services:
  db:
    image: postgres:16-alpine
    container_name: lotlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lotlens
      POSTGRES_USER: lotlens
      POSTGRES_PASSWORD: lotlens_dev_only
    ports:
      - "5432:5432"
    volumes:
      - lotlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotlens -d lotlens"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lotlens_pgdata:
